# LUC UI — continuous integration for the standalone repository.
#
# Four jobs, each with one failure mode:
#
#   verify   MANDATORY. Everything that is deterministic on any Linux runner:
#            types, lint, unit tests, i18n coverage, chart catalogue, the docs
#            registry, package exports and the consumer proof. It is one
#            command — `pnpm verify` — because re-listing its steps here would
#            be a second pipeline to keep in sync with the first.
#
#   consumer MANDATORY. It creates clean Vite and Next.js projects outside this
#            workspace, installs the packed artifact with plain npm, builds both
#            for production and loads them in Chromium.
#
#   browser  MANDATORY. Route health, behaviour, axe, mobile overflow, live
#            i18n and brand rendering against the production Showcase image.
#
#   visual   MANDATORY. Linux-only pixel baselines (ADR-036). Keeping this
#            separate means a visual diff cannot hide a functional browser
#            failure, and a browser failure cannot be mistaken for an unreviewed
#            screenshot.
#
# The two browser jobs each build the same production image on an isolated
# runner. That costs one extra build but keeps their check contexts and failure
# reports independent without introducing an image registry or shared artifact.
# The runner is pinned to Ubuntu 24.04 because the Linux pixel baselines are
# host-specific; `ubuntu-latest` is scheduled to move to Ubuntu 26 on
# 2026-10-19 and must not silently change the rendering environment.
#
# Not here, on purpose: no publish, no tag, no release and no deploy. The
# package is distributed from a git tag cut by hand (docs/RELEASES.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (types, lint, tests, docs, package)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json, so CI and a
      # developer run the same pnpm.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # typecheck · lint · unit tests · i18n · charts · docs registry ·
      # package exports/consumer · release-artifact reproducibility.
      - name: Verify
        run: pnpm verify

  consumer:
    name: clean consumer apps (Vite + Next.js)
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for consumer checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Install, build and load the packed package
        run: pnpm test:consumers

      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-evidence
          path: artifacts/consumers
          retention-days: 14
          if-no-files-found: ignore

  browser-qa:
    name: browser QA (routes, axe, behaviour)
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # The production Showcase, built and run exactly as the review stack runs
      # it. `docker compose config` is asserted first so a changed service name
      # or published port fails here rather than five minutes later.
      - name: Build and start the Showcase
        run: |
          docker compose config > /dev/null
          node scripts/qa-server.mjs --ensure-only

      # Route health + axe + behaviour at desktop and 390 px. The target-size
      # probe is separate because axe does not evaluate that rule in the
      # touch-emulated mobile context — see qa/target-size.mjs. Brand assets
      # are checked in the browser because a filename test cannot prove which
      # variant is painted after hydration.
      - name: Browser QA
        run: |
          export LUC_QA_BASE_URL=http://127.0.0.1:5300
          pnpm qa:full
          node apps/showcase/qa/target-size.mjs
          node apps/showcase/qa/brand-assets.mjs

      - name: Stop the Showcase
        if: always()
        run: docker compose down

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence
          path: artifacts/reports
          retention-days: 14
          if-no-files-found: ignore

  visual-regression:
    name: visual regression (Linux baselines)
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and start the Showcase
        run: |
          docker compose config > /dev/null
          node scripts/qa-server.mjs --ensure-only

      # Linux baselines only. On macOS this suite skips with a reason instead of
      # writing a snapshot (ADR-036); on the Linux runner it asserts.
      - name: Visual baselines (Linux)
        run: pnpm qa:baseline
        env:
          LUC_QA_BASE_URL: http://127.0.0.1:5300

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/showcase/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop the Showcase
        if: always()
        run: docker compose down
